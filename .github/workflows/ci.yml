name: assay

on:
  push:
    branches: [main]
  pull_request:

jobs:
  eval:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: pip install -e ".[dev]"

      - name: Unit tests
        run: pytest -q

      - name: Harness calibration (grader separates success from failure)
        run: python -m bench selfcheck

      - name: Customer-layer calibration (grading a foreign schema)
        run: python -m bench customer

      - name: Agent eval + gate (oracle must sweep the matrix)
        run: >
          python -m bench eval
          --agent oracle
          --conditions seven
          --trials 1
          --report runs/report.html
          --min-pass-rate 1.0

      - name: Upload robustness report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: assay-report
          path: runs/report.html
          if-no-files-found: warn
