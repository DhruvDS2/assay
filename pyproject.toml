[project]
name = "groundtruth"
version = "0.1.0"
description = "A robustness bench for web agents, built on an environment you own."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
    "itsdangerous>=2.1",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8"]
llm = ["anthropic>=0.49"]
solari = ["solari-browser>=0.1.2", "solari-sandbox>=0.2.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*", "bench*"]

[tool.setuptools.package-data]
app = ["schema.sql", "templates/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
